# Unified DDQN - COUNT/HARD - rho-family member (access/core ratio 3.0).
# Controlled sweep: same core graph, same endpoints, same traffic; only the
# access-to-core capacity ratio varies, which moves the bottleneck between the
# shared access link (rho=0, routing useless) and the core (rho>0, routing
# matters). capacity_scale is calibrated so greedy acceptance ~= 0.47 at every
# level, so rho is not confounded with offered load.
#   measured: rho = 14.42%   greedy acceptance = 0.4744
_base_: configs/base.yaml

agent: ddqn_unified
mode: unified
seed: 42
topology_file: data/rho_family/topo_r3.0.json
capacity_scale: 0.3442

run_name: ddqn_unified_rho_r3p0
wandb_project: netslice-drl
wandb_tags: [ddqn, unified, count, hard, rho-sweep]
